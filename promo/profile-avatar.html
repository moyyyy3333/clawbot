<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile Photo — Premium AI</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@200;300;700&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  background: #08080f;
}

/* Preview at 400px, actual export at 400x400 */
.preview {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 40px;
}

.avatar {
  width: 400px;
  height: 400px;
  border-radius: 50%;
  overflow: hidden;
  position: relative;
  background: radial-gradient(ellipse at 30% 20%, #0a0a1a 0%, #05050a 100%);
  box-shadow: 
    0 0 80px rgba(99, 102, 241, 0.15),
    0 0 160px rgba(139, 92, 246, 0.08),
    inset 0 0 80px rgba(99, 102, 241, 0.05);
}

/* Subtle ring glow */
.avatar::before {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 50%;
  border: 2px solid rgba(99, 102, 241, 0.25);
  box-shadow: 
    inset 0 0 40px rgba(99, 102, 241, 0.08),
    0 0 40px rgba(99, 102, 241, 0.06);
  z-index: 2;
}

/* Geometric neural network lines - very subtle */
.neural-bg {
  position: absolute;
  inset: 0;
  z-index: 0;
}

.neural-bg .line {
  position: absolute;
  background: linear-gradient(90deg, transparent, rgba(99, 102, 241, 0.06), transparent);
  height: 1px;
  width: 100%;
}

.neural-bg .line:nth-child(1) { top: 20%; transform: rotate(-15deg); }
.neural-bg .line:nth-child(2) { top: 45%; transform: rotate(8deg); }
.neural-bg .line:nth-child(3) { top: 70%; transform: rotate(-5deg); }
.neural-bg .line:nth-child(4) { top: 85%; transform: rotate(20deg); width: 80%; left: 10%; }

/* Main symbol — abstract "O" / infinity / AI node */
.symbol {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  z-index: 1;
  width: 180px;
  height: 180px;
}

/* Central glow */
.symbol::before {
  content: '';
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 100px;
  height: 100px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(99, 102, 241, 0.3), transparent 70%);
  filter: blur(5px);
}

/* Outer ring */
.ring-outer {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  border: 2.5px solid rgba(99, 102, 241, 0.3);
  box-sizing: border-box;
  animation: pulse 4s ease-in-out infinite;
}

/* Middle ring - segmented */
.ring-mid {
  position: absolute;
  top: 15%;
  left: 15%;
  width: 70%;
  height: 70%;
  border-radius: 50%;
  border: 2px solid rgba(139, 92, 246, 0.2);
  box-sizing: border-box;
  animation: pulse 4s ease-in-out infinite 0.5s;
}

/* Inner solid dot - the "AI core" */
.core {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: linear-gradient(135deg, #6366f1, #a78bfa);
  box-shadow: 
    0 0 20px rgba(99, 102, 241, 0.5),
    0 0 60px rgba(99, 102, 241, 0.2);
  z-index: 2;
}

/* Arc segments (like orbits) */
.arc {
  position: absolute;
  border-radius: 50%;
  box-sizing: border-box;
  border: 1.5px solid transparent;
  opacity: 0.5;
}

.arc-1 {
  top: 5%;
  left: 5%;
  width: 90%;
  height: 90%;
  border-top-color: rgba(99, 102, 241, 0.4);
  border-right-color: rgba(139, 92, 246, 0.2);
  animation: spin 6s linear infinite;
}

.arc-2 {
  top: 10%;
  left: 10%;
  width: 80%;
  height: 80%;
  border-bottom-color: rgba(167, 139, 250, 0.3);
  border-left-color: rgba(99, 102, 241, 0.15);
  animation: spin 8s linear infinite reverse;
}

/* Connection dots orbiting */
.dot {
  position: absolute;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #818cf8;
  box-shadow: 0 0 10px rgba(99, 102, 241, 0.6);
  z-index: 3;
}

.dot-1 { top: 15%; left: 50%; transform: translateX(-50%); animation: orbit 5s linear infinite; }
.dot-2 { bottom: 18%; right: 15%; animation: orbit 7s linear infinite reverse; }
.dot-3 { bottom: 15%; left: 18%; animation: orbit 6s linear infinite 1s; }

/* Floating particles */
.particle {
  position: absolute;
  border-radius: 50%;
  background: rgba(99, 102, 241, 0.15);
  animation: float 8s ease-in-out infinite;
}

.particle:nth-child(1) { width: 3px; height: 3px; top: 25%; left: 80%; }
.particle:nth-child(2) { width: 2px; height: 2px; top: 60%; left: 15%; animation-delay: 2s; }
.particle:nth-child(3) { width: 4px; height: 4px; top: 75%; left: 75%; animation-delay: 4s; }
.particle:nth-child(4) { width: 2px; height: 2px; top: 35%; left: 20%; animation-delay: 1s; }
.particle:nth-child(5) { width: 3px; height: 3px; top: 80%; left: 40%; animation-delay: 3s; }

/* Orbital path dots - markers along the arcs */
.orbital-dot {
  position: absolute;
  width: 4px;
  height: 4px;
  background: #a78bfa;
  border-radius: 50%;
  box-shadow: 0 0 8px rgba(167, 139, 250, 0.4);
}

.orbital-dot:nth-child(1) { top: 8%; left: 50%; animation: orbitInner 4s linear infinite; }
.orbital-dot:nth-child(2) { top: 35%; right: 8%; animation: orbitInner 6s linear infinite reverse; }

@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

@keyframes pulse {
  0%, 100% { opacity: 0.6; }
  50% { opacity: 1; }
}

@keyframes float {
  0%, 100% { transform: translateY(0) scale(1); opacity: 0.15; }
  50% { transform: translateY(-8px) scale(1.5); opacity: 0.3; }
}

@keyframes orbit {
  0% { transform: rotate(0deg) translateX(100px) rotate(0deg); }
  100% { transform: rotate(360deg) translateX(100px) rotate(-360deg); }
}

@keyframes orbitInner {
  0% { transform: rotate(0deg) translateX(60px) rotate(0deg); }
  100% { transform: rotate(360deg) translateX(60px) rotate(-360deg); }
}

/* Text below */
.handle {
  font-family: 'Inter', sans-serif;
  font-size: 20px;
  font-weight: 300;
  color: rgba(255,255,255,0.3);
  letter-spacing: 4px;
  text-transform: uppercase;
}

.handle span {
  font-weight: 700;
  background: linear-gradient(135deg, #818cf8, #a78bfa);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
</style>
</head>
<body>
<div class="preview">
  <div class="avatar" id="avatar">
    <div class="neural-bg">
      <div class="line"></div>
      <div class="line"></div>
      <div class="line"></div>
      <div class="line"></div>
    </div>
    
    <div class="symbol">
      <div class="ring-outer"></div>
      <div class="ring-mid"></div>
      <div class="arc arc-1"></div>
      <div class="arc arc-2"></div>
      <div class="core"></div>
      <div class="orbital-dot"></div>
      <div class="orbital-dot"></div>
    </div>
    
    <div class="dot dot-1"></div>
    <div class="dot dot-2"></div>
    <div class="dot dot-3"></div>
    
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
  </div>
  
  <div class="handle">@<span>dealermattai</span></div>
</div>

<script>
// When ready, take a screenshot at 400x400px
// The animation keeps running - screenshot at peak glow
console.log('Profile avatar ready at 400x400');
</script>
</body>
</html>
