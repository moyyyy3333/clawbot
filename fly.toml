# ClawBot Pro — Fly.io (replaces Railway)
# Deploy: fly launch --copy-config --yes  OR  fly deploy
# Volume: fly volumes create clawbot_data --region iad --size 1
# Secrets: fly secrets set TELEGRAM_BOT_TOKEN=... STRIPE_SECRET_KEY=... STRIPE_WEBHOOK_SECRET=... STRIPE_PRICE_ID=... PUBLIC_URL=https://<app>.fly.dev DB_PATH=/data/clawbot.db

app = "clawbot-pro"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  PYTHONUNBUFFERED = "1"
  DB_PATH = "/data/clawbot.db"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[http_service.checks]]
  interval = "15s"
  timeout = "2s"
  grace_period = "20s"
  method = "GET"
  path = "/"

[mounts]
  source = "clawbot_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  cpus = 1
